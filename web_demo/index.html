<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RaioSafe — Demo</title>
<style>
  :root {
    --bg1: #1b2229;
    --bg2: #0f1318;
    --accent: #4CAF50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2) 70%);
    color: #fff;
  }
  .brand {
    text-align: center;
  }
  .brand h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .brand p {
    margin: 6px 0 0;
    color: #9aa3ad;
    font-size: 14px;
  }
  .phone {
    position: relative;
    width: 375px;
    height: 812px;
    max-width: 92vw;
    max-height: 80vh;
    aspect-ratio: 375 / 812;
    background: #000;
    border-radius: 48px;
    padding: 14px;
    box-shadow:
      0 0 0 2px #333,
      0 30px 60px rgba(0, 0, 0, 0.5),
      0 10px 20px rgba(0, 0, 0, 0.4);
  }
  .phone::before {
    content: "";
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 24px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 2;
  }
  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 34px;
    overflow: hidden;
    background: #f2f3f7;
  }
  .screen iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .side-button {
    position: absolute;
    background: #1c1c1e;
    border-radius: 2px;
  }
  .side-button.power { right: -3px; top: 160px; width: 3px; height: 70px; }
  .side-button.vol-up { left: -3px; top: 140px; width: 3px; height: 32px; }
  .side-button.vol-down { left: -3px; top: 180px; width: 3px; height: 32px; }
  footer {
    color: #6b7580;
    font-size: 12px;
    text-align: center;
  }
  footer a { color: #9aa3ad; }
</style>
</head>
<body>
  <div class="brand">
    <h1>⚡ RaioSafe</h1>
    <p>Monitoramento inteligente de energia residencial — demo interativa</p>
  </div>

  <div class="phone">
    <span class="side-button power"></span>
    <span class="side-button vol-up"></span>
    <span class="side-button vol-down"></span>
    <div class="screen">
      <iframe src="app/" title="RaioSafe app"></iframe>
    </div>
  </div>

  <footer>
    Login de demonstração: <strong>sonia@raiosafe.com</strong> / <strong>123456</strong>
  </footer>
</body>
</html>
